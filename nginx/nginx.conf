events {
    worker_connections 1024;
}

http {
    upstream backend {
        server rust-app-1:3007;
        server rust-app-2:3008;
    }

    server {
        listen 8080;
        server_name localhost;

        # API proxy to backend - specifically for /api/ routes
        location ^~ /api/ {
            proxy_pass http://backend/api/; # Ensure /api/ prefix is preserved
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Load balancing for other API requests or fallback
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /generated-images/ {
            alias /usr/share/nginx/html/generated-images/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
