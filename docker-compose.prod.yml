services:
  database:
    image: ${DOCKER_HUB_USERNAME:-ruthrogoway}/gallery_docker_project_db:latest
    container_name: gallery-db
    volumes:
      - db_data:/data
    networks:
      - gallery-network
    restart: unless-stopped

  backend: # Changed service name
    image: ${DOCKER_HUB_USERNAME:-ruthrogoway}/gallery_docker_project:latest
    # container_name: rust-app-1 # Docker Compose will handle scaling and name instances
    # We can define multiple instances for this service
    deploy:
      replicas: 2 # Docker Compose will create two instances named backend_1, backend_2
    environment:
      - DATABASE_URL=sqlite:/data/mydb.db
      - PORT=3007 # Nginx will handle port mapping
    volumes:
      - db_data:/data
    depends_on:
      - database
    networks:
      - gallery-network
    restart: unless-stopped

  nginx:
    image: ${DOCKER_HUB_USERNAME:-ruthrogoway}/gallery_docker_project_nginx:latest
    container_name: gallery-nginx
    ports:
      - "8080:8080"
    depends_on:
      - backend # Changed dependency
    networks:
      - gallery-network
    restart: unless-stopped

  frontend:
    image: ${DOCKER_HUB_USERNAME:-ruthrogoway}/gallery_docker_project_frontend:latest
    container_name: gallery-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_BASE_URL=http://16.171.218.167:8080
    depends_on:
      - nginx
    networks:
      - gallery-network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  gallery-network:
    driver: bridge
