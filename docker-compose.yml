services:
  database:
    build: ./sqlite-db
    container_name: gallery-db
    volumes:
      - db_data:/data
    networks:
      - gallery-network

  rust-app-1:
    build: ./gallery_server_rust-main
    container_name: rust-app-1
    ports:
      - "3007:3007"
    environment:
      - DATABASE_URL=sqlite:/data/mydb.db
      - PORT=3007
      - HF_API_KEY=${HF_API_KEY}
    volumes:
      - db_data:/data
      - ai_images:/app/ai_images
    depends_on:
      - database
    networks:
      - gallery-network
    restart: unless-stopped

  rust-app-2:
    build: ./gallery_server_rust-main
    container_name: rust-app-2
    ports:
      - "3008:3008"
    environment:
      - DATABASE_URL=sqlite:/data/mydb.db
      - PORT=3008
      - HF_API_KEY=${HF_API_KEY}
    volumes:
      - db_data:/data
      - ai_images:/app/ai_images
    depends_on:
      - database
    networks:
      - gallery-network
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: gallery-nginx
    ports:
      - "8080:8080"
    depends_on:
      - rust-app-1
      - rust-app-2
    networks:
      - gallery-network
    volumes:
      - ai_images:/usr/share/nginx/html/generated-images
    restart: unless-stopped

  frontend:
    build: ./gallery_app_react-main
    container_name: gallery-frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - gallery-network
    restart: unless-stopped

volumes:
  db_data:
    driver: local
  ai_images:
    driver: local

networks:
  gallery-network:
    driver: bridge
