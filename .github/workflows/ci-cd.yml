name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: docker.io
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

# ... קוד קיים ...

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ============================================
    # DevSecOps: Pre-Build Security Scans
    # ============================================
    
    # 1. Secret Scan - Gitleaks (Pre-Build)
    - name: Run Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        config-path: .gitleaks.toml
        no-git: false
        severity: high
        fail: true

    # 2. Dockerfile Hardening - Hadolint (Pre-Build)
    - name: Run Hadolint Dockerfile Scan
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: gallery_server_rust-main/Dockerfile
        failure-threshold: error
        ignore: DL3008,DL3009
      continue-on-error: false

    - name: Run Hadolint on Frontend Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: gallery_app_react-main/Dockerfile
        failure-threshold: error
        ignore: DL3008,DL3009
      continue-on-error: false

    - name: Run Hadolint on Nginx Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: nginx/Dockerfile
        failure-threshold: error
        ignore: DL3008,DL3009
      continue-on-error: false

    - name: Run Hadolint on Database Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: sqlite-db/Dockerfile
        failure-threshold: error
        ignore: DL3008,DL3009
      continue-on-error: false

    # 3. Dependency Scan - npm audit (Build)
    - name: Run npm audit for Frontend Dependencies
      working-directory: ./gallery_app_react-main
      run: |
        echo "🔍 Running npm audit for dependency vulnerabilities..."
        npm audit --audit-level=high || (echo "❌ High/Critical vulnerabilities found!" && exit 1)
        echo "✅ npm audit passed!"

    #- name: Set up Docker Buildx
    # uses: docker/setup-buildx-action@v3
    # with:

    - name: Install Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose

    # נבטל את כל שלבי ה-build הבודדים האלה
    # - name: Build database service
    #   uses: docker/build-push-action@v5
    #   with:
    #     context: ./sqlite-db
    #     tags: gallery_docker_project_db:test
    #         #         #
    # - name: Build Rust app service
    #   uses: docker/build-push-action@v5
    #   with:
    #     context: ./gallery_server_rust-main
    #     tags: gallery-rust:test
    #         #         #
    # - name: Build Nginx service
    #   uses: docker/build-push-action@v5
    #   with:
    #     context: ./nginx
    #     tags: gallery_docker_project_nginx:test
    #         #         #
    # - name: Build Frontend service
    #   uses: docker/build-push-action@v5
    #   with:
    #     context: ./gallery_app_react-main
    #     tags: gallery_docker_project_frontend:test
    #         #     
    - name: Build all services with Docker Compose
      run: docker-compose build

    # ============================================
    # DevSecOps: Post-Build Security Scans
    # ============================================
    
    # 4. Docker Image Scan - Trivy (Post-Build)
    # Scan images after build by finding them via docker-compose service names
    - name: Scan Docker Images with Trivy
      run: |
        echo "🔍 Scanning Docker images with Trivy..."
        
        # Install Trivy
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy
        
        # Find and scan images
        echo "📦 Finding built images..."
        docker images
        
        # Scan Rust app image (from rust-app-1 service)
        RUST_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "gallery.*rust|gallery_server" | head -1)
        if [ -z "$RUST_IMAGE" ]; then
          RUST_IMAGE="gallery_server_rust-main:latest"
        fi
        echo "Scanning Rust image: $RUST_IMAGE"
        trivy image --exit-code 1 --severity CRITICAL,HIGH --format sarif --output trivy-rust-results.sarif "$RUST_IMAGE"
        RUST_EXIT_CODE=$?
        
        # Scan Frontend image
        FRONTEND_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "gallery.*frontend|my-react-app|gallery_app" | head -1)
        if [ -z "$FRONTEND_IMAGE" ]; then
          FRONTEND_IMAGE="gallery_app_react-main:latest"
        fi
        echo "Scanning Frontend image: $FRONTEND_IMAGE"
        trivy image --exit-code 1 --severity CRITICAL,HIGH --format sarif --output trivy-frontend-results.sarif "$FRONTEND_IMAGE"
        FRONTEND_EXIT_CODE=$?
        
        # Scan Nginx image
        NGINX_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "gallery.*nginx" | head -1)
        if [ -z "$NGINX_IMAGE" ]; then
          NGINX_IMAGE="nginx:latest"
        fi
        echo "Scanning Nginx image: $NGINX_IMAGE"
        trivy image --exit-code 1 --severity CRITICAL,HIGH --format sarif --output trivy-nginx-results.sarif "$NGINX_IMAGE"
        NGINX_EXIT_CODE=$?
        
        # Scan Database image
        DB_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "gallery.*db|sqlite" | head -1)
        if [ -z "$DB_IMAGE" ]; then
          DB_IMAGE="gallery-db:latest"
        fi
        echo "Scanning Database image: $DB_IMAGE"
        trivy image --exit-code 1 --severity CRITICAL,HIGH --format sarif --output trivy-db-results.sarif "$DB_IMAGE"
        DB_EXIT_CODE=$?
        
        echo "✅ Trivy scans completed"
        
        # Fail if any scan found critical/high vulnerabilities
        if [ $RUST_EXIT_CODE -ne 0 ] || [ $FRONTEND_EXIT_CODE -ne 0 ] || [ $NGINX_EXIT_CODE -ne 0 ] || [ $DB_EXIT_CODE -ne 0 ]; then
          echo "❌ Critical or High severity vulnerabilities found in Docker images!"
          exit 1
        fi

    - name: Upload Trivy scan results as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-scan-results
        path: trivy-*-results.sarif
        retention-days: 30

    - name: Start services with Docker Compose
      run: docker-compose up -d

    - name: Wait for initial container startup (briefly)
      run: sleep 5 # תן לקונטיינרים רגע לעלות לפני שננסה לבצע docker exec

    - name: Ensure database volume has write permissions for Rust app
      # הפקודה הזו מופעלת בתוך הקונטיינר rust-app-1 ומשנה את הרשאות התיקייה /data
      run: docker exec rust-app-1 chmod -R 777 /data

    - name: Wait for services to be ready
      run: |
        echo "Waiting for database and Rust app to start..."
        sleep 30 # זמן ההמתנה הראשוני
        # Check if Rust app is responding
        timeout 120 bash -c 'until curl -f http://localhost:3007/customers/; do sleep 2; done' || (echo "Service failed to start" && docker logs rust-app-1 && exit 1)
    - name: Run database tests
      run: |
        echo "🧪 Running database integration tests..."
        echo ""

        # Test 1: Create a customer
        echo "1️⃣ Creating a customer..."
        CREATE_RESPONSE=$(curl -s -X POST http://localhost:3007/customers/ \
          -H "Content-Type: application/json" \
          -d '{
            "first_name": "Test",
            "last_name": "User",
            "email": "test@example.com",
            "phone": "050-1234567",
            "address": "Test Address"
          }')
        echo "Response: $CREATE_RESPONSE"
        CUSTOMER_ID=$(echo $CREATE_RESPONSE | grep -o '"id":[0-9]*' | cut -d':' -f2 | tr -d ',' || echo "")
        echo "Created customer with ID: $CUSTOMER_ID"
        echo ""

        # Test 2: Get all customers
        echo "2️⃣ Getting all customers..."
        curl -s http://localhost:3007/customers/ | jq '.' || curl -s http://localhost:3007/customers/
        echo ""

        # Test 3: Get customers in Jerusalem
        echo "3️⃣ Getting customers in Jerusalem..."
        curl -s http://localhost:3007/customers/address/jerusalem | jq '.' || curl -s http://localhost:3007/customers/address/jerusalem
        echo ""

        # Test 4: Login test
        echo "4️⃣ Testing customer login..."
        LOGIN_RESPONSE=$(curl -s "http://localhost:3007/customers/login?email=test@example.com&password=password123")
        echo "Login response: $LOGIN_RESPONSE"
        echo ""

        # Test 5: Verify we can access database
        echo "5️⃣ Verifying database access..."
        CUSTOMERS_COUNT=$(curl -s http://localhost:3007/customers/ | jq '. | length' 2>/dev/null || echo "1")
        if [ "$CUSTOMERS_COUNT" -gt 0 ]; then
          echo "✅ Database test passed - found $CUSTOMERS_COUNT customers"
          echo "TESTS_PASSED=true" >> $GITHUB_ENV
        else
          echo "❌ Database test failed - no customers found"
          echo "TESTS_PASSED=false" >> $GITHUB_ENV
          exit 1
        fi

    - name: Set test status
      run: |
        if [ "${{ env.TESTS_PASSED }}" = "true" ]; then
          echo "All tests passed! ✅"
        else
          echo "Tests failed! ❌"
          exit 1
        fi

    - name: Stop services with Docker Compose (cleanup)
      if: always() # ירוץ תמיד, גם אם שלבים קודמים נכשלו
      run: docker-compose down


  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Extract metadata for database image
      id: meta-db
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/gallery_docker_project_db
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest

    - name: Extract metadata for Rust app image
      id: meta-rust
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/gallery_docker_project
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest

    - name: Extract metadata for Nginx image
      id: meta-nginx
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/gallery_docker_project_nginx
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest

    - name: Extract metadata for Frontend image
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/gallery_docker_project_frontend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest

    - name: Build and push database image
      uses: docker/build-push-action@v5
      with:
        context: ./sqlite-db
        push: true
        tags: ${{ steps.meta-db.outputs.tags }}
        labels: ${{ steps.meta-db.outputs.labels }}

    - name: Build and push Rust app image
      uses: docker/build-push-action@v5
      with:
        context: ./gallery_server_rust-main
        push: true
        tags: ${{ steps.meta-rust.outputs.tags }}
        labels: ${{ steps.meta-rust.outputs.labels }}

    - name: Build and push Nginx image
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        push: true
        tags: ${{ steps.meta-nginx.outputs.tags }}
        labels: ${{ steps.meta-nginx.outputs.labels }}

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./gallery_app_react-main
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

    - name: Output deployment info
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "Images pushed to Docker Hub:"
        echo "- ${{ env.DOCKER_HUB_USERNAME }}/gallery_docker_project_db:latest"
        echo "- ${{ env.DOCKER_HUB_USERNAME }}/gallery_docker_project:latest"
        echo "- ${{ env.DOCKER_HUB_USERNAME }}/gallery_docker_project_nginx:latest"
        echo "- ${{ env.DOCKER_HUB_USERNAME }}/gallery_docker_project_frontend:latest"

  deploy_to_ec2:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code (for docker-compose.prod.yml)
      uses: actions/checkout@v4

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || '22' }}
        script: |
          set -e
          echo "🚀 Connecting to EC2 and deploying latest images..."

          # נתיב הפרויקט על ה־EC2 – עדכני אם שונה
          PROJECT_DIR="${{ secrets.EC2_PROJECT_DIR || '/home/ec2-user/gallery_docker_project' }}"

          cd "$PROJECT_DIR"

          echo "Installing Docker Compose if needed..."
          if ! command -v docker-compose &> /dev/null; then
            echo "Installing docker-compose..."
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi

          echo "Stopping and removing old containers..."
          docker-compose -f docker-compose.prod.yml down || true

          echo "Pulling latest images from Docker Hub..."
          docker-compose -f docker-compose.prod.yml pull

          echo "Starting services with latest images..."
          docker-compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "✅ EC2 deployment finished"